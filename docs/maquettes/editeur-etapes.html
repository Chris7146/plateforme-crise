<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<style>:root{--font-mono:'DejaVu Sans Mono',monospace;--font-voice:'DejaVu Serif',serif;--font-sans:'DejaVu Sans',sans-serif}
body{margin:0;padding:24px;background:#030806;font-family:var(--font-sans);max-width:760px}.sr-only{display:none}
input[type=range]{accent-color:#3ecf8e}button{font-family:inherit}</style></head><body><div id="shot">
<style>.st{display:flex;align-items:center;gap:6px;padding:7px 8px;border:0.5px solid #1d3328;border-radius:6px;margin-bottom:6px;font-size:12px;background:#0b1712}.st.sel{border-color:#3ecf8e;background:#0f2a1e}.sec{border:0.5px solid #1d3328;border-radius:8px;padding:10px 12px;margin-top:10px}.sh{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#7f9a8a;margin-bottom:6px}.it{display:flex;align-items:center;gap:8px;font-size:12px;padding:6px 0;border-top:0.5px solid #14261d}.bg{font-size:11px;padding:1px 6px;border-radius:4px}.ib{white-space:nowrap;font-family:var(--font-mono);font-size:11px;padding:3px 8px;border-radius:5px;border:0.5px solid #2c4a3a;background:#0b1712;color:#3ecf8e}.fi{background:#0b1712;color:#d7e5dc;border:0.5px solid #1d3328;border-radius:6px;font-family:var(--font-mono);font-size:12px;height:30px;padding:0 8px;box-sizing:border-box}</style>
<div style="border-radius:12px;overflow:hidden;background:#07100c;border:0.5px solid #1d3328;font-family:var(--font-mono);color:#d7e5dc;">
<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px;border-bottom:0.5px solid #1d3328;">
<div><div style="font-size:11px;color:#7f9a8a;">modèle : cyberattaque établissement de santé <i class="ti ti-arrow-right"></i> variante</div><div style="font-size:15px;">CHU de Valmont <span class="bg" style="color:#9fb8a9;background:#14261d;margin-left:6px;">brouillon</span></div></div>
<div style="display:flex;gap:8px;align-items:center;"><span id="tot" style="font-size:12px;color:#9fb8a9;white-space:nowrap;"></span><button class="ib" style="color:#d7e5dc;"><i class="ti ti-eye"></i> prévisualiser</button><button class="ib" style="background:#123a28;border-color:#3ecf8e;"><i class="ti ti-device-floppy"></i> enregistrer</button></div></div>
<div style="display:grid;grid-template-columns:200px minmax(0,1fr);">
<div style="border-right:0.5px solid #1d3328;padding:10px;"><div style="font-size:11px;color:#7f9a8a;margin-bottom:8px;">étapes · glisser pour réordonner</div><div id="list"></div>
<button class="ib" style="width:100%;padding:7px;"><i class="ti ti-plus"></i> ajouter une étape</button>
<div style="font-size:11px;color:#7f9a8a;margin-top:14px;line-height:1.7;"><span class="bg" style="color:#9fb8a9;background:#14261d;">modèle</span> hérité<br><span class="bg" style="color:#6fb6f2;background:#0b1a2a;">variante</span> spécifique client</div></div>
<div id="ed" style="padding:10px 14px 14px;min-width:0;"></div></div></div>
<script>
const I={video:'ti-movie',article:'ti-news',image:'ti-photo',doc:'ti-file-text'};
const S=[{t:'Alerte initiale',d:5},{t:'Premiers constats',d:10},{t:'Propagation',d:8,v:true,m:[['article','Le Courrier de Valmont · flash info','auto · T+0',1],['image','Carte des services touchés','auto · T+2 min',0]],a:'Sirène d\u2019alerte · boucle · 60 s',q:[['choix multiple','Quelles décisions prenez-vous dans l\u2019heure ?','3 attendues · 10 pts',0],['ouverte','Réponse au journaliste','grille animateur · 10 pts',1]],h:[['manuel','Fiche réflexe communication p. 2','équipes 2, 3',0],['auto · T+6 min','Désigner un porte-parole','toutes',1]]},{t:'Pression médiatique',d:10,v:true},{t:'Arbitrages',d:12},{t:'Sortie de crise',d:8}];
const sel=2;const B=v=>v?'<span class="bg" style="color:#6fb6f2;background:#0b1a2a;">variante</span>':'<span class="bg" style="color:#9fb8a9;background:#14261d;">modèle</span>';
document.getElementById('list').innerHTML=S.map((s,i)=>`<div class="st ${i===sel?'sel':''}"><i class="ti ti-grip-vertical" style="color:#5f7a6b;"></i><div style="flex:1;min-width:0;"><div>${i+1}. ${s.t}</div><div style="font-size:11px;color:#7f9a8a;">${s.d} min${s.v?' · <span style="color:#6fb6f2;">modifiée</span>':''}</div></div><span style="display:flex;flex-direction:column;"><i class="ti ti-chevron-up" style="color:#5f7a6b;"></i><i class="ti ti-chevron-down" style="color:#5f7a6b;"></i></span></div>`).join('');
document.getElementById('tot').textContent='6 étapes · 0 h 53';
const sec=(title,btn,rows)=>`<div class="sec"><div class="sh"><span>${title}</span>${btn}</div>${rows}</div>`;const s=S[sel];
document.getElementById('ed').innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;"><span style="font-size:12px;color:#7f9a8a;">étape 3 / 6</span>${B(1)}</div>
<div style="display:grid;grid-template-columns:minmax(0,1fr) 100px;gap:8px;margin-top:8px;"><div class="fi" style="line-height:30px;">Propagation</div><div style="display:flex;align-items:center;gap:4px;"><div class="fi" style="width:56px;line-height:30px;">8</div><span style="font-size:12px;color:#7f9a8a;">min</span></div></div>
<div style="display:flex;align-items:center;gap:8px;font-size:12px;color:#9fb8a9;margin-top:10px;"><i class="ti ti-clock-stop"></i>fin du temps :<div class="fi" style="height:28px;line-height:28px;">attendre l\u2019animateur <i class="ti ti-chevron-down"></i></div></div>
${sec('contenus diffusés','<button class="ib"><i class="ti ti-upload"></i> ajouter</button>',s.m.map(m=>`<div class="it"><i class="ti ${I[m[0]]}" style="font-size:16px;color:#3ecf8e;"></i><span style="flex:1;">${m[1]}</span><span style="color:#7f9a8a;font-size:11px;">${m[2]}</span>${B(m[3])}</div>`).join(''))}
${sec('ambiance sonore','<button class="ib"><i class="ti ti-music"></i> choisir</button>',`<div class="it"><i class="ti ti-volume" style="font-size:16px;color:#f2b43c;"></i><span style="flex:1;">${s.a}</span><span style="color:#7f9a8a;font-size:11px;">démarrage auto</span></div>`)}
${sec('questions','<button class="ib"><i class="ti ti-plus"></i> ajouter</button>',s.q.map(q=>`<div class="it"><span class="bg" style="color:#3ecf8e;background:#0f2a1e;white-space:nowrap;">${q[0]}</span><span style="flex:1;">${q[1]}<br><span style="color:#7f9a8a;font-size:11px;">attendu : ${q[2]}</span></span>${B(q[3])}</div>`).join(''))}
${sec('indices','<button class="ib"><i class="ti ti-plus"></i> ajouter</button>',s.h.map(h=>`<div class="it"><i class="ti ti-bulb" style="font-size:16px;color:#f2b43c;"></i><span style="flex:1;">${h[1]}<br><span style="color:#7f9a8a;font-size:11px;">${h[0]} · ${h[2]}</span></span>${B(h[3])}</div>`).join(''))}`;
</script>
</div></body></html>
