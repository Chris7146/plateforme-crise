<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<style>:root{--font-mono:'DejaVu Sans Mono',monospace;--font-voice:'DejaVu Serif',serif;--font-sans:'DejaVu Sans',sans-serif}
body{margin:0;padding:24px;background:#030806;font-family:var(--font-sans);max-width:760px}.sr-only{display:none}
input[type=range]{accent-color:#3ecf8e}button{font-family:inherit}</style></head><body><div id="shot">
<style>.mc{background:#0b1712;border:0.5px solid #1d3328;border-radius:8px;padding:8px 10px}.ml{font-size:11px;color:#7f9a8a}.mv{font-size:18px;font-weight:500;margin-top:2px}.seg{position:absolute;bottom:2px;height:18px;border-radius:3px;font-size:11px;display:flex;align-items:center;justify-content:center;box-sizing:border-box;overflow:hidden}.seg.sel{outline:1.5px solid #d7e5dc}.mk{position:absolute;top:0;font-size:12px;transform:translateX(-50%)}.fl{display:flex;align-items:center;gap:5px;font-size:12px;color:#9fb8a9}.ib{font-family:var(--font-mono);font-size:11px;padding:4px 9px;border-radius:5px;border:0.5px solid #2c4a3a;background:#0b1712;color:#d7e5dc}</style>
<div style="border-radius:12px;overflow:hidden;background:#07100c;border:0.5px solid #1d3328;font-family:var(--font-mono);color:#d7e5dc;">
<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px;border-bottom:0.5px solid #1d3328;">
<div><div style="font-size:11px;color:#7f9a8a;">RETEX · exercice terminé le 24/09 · 14:00 – 15:05</div><div style="font-size:15px;">Cyberattaque — CHU de Valmont</div></div>
<div style="display:flex;gap:8px;"><button class="ib"><i class="ti ti-file-type-pdf"></i> exporter</button><button class="ib"><i class="ti ti-archive"></i> archiver</button></div></div>
<div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:12px 14px 4px;">
<div class="mc"><div class="ml">durée réelle</div><div class="mv">1 h 05</div><div class="ml">prévu 53 min</div></div>
<div class="mc"><div class="ml">note moyenne</div><div class="mv" style="color:#3ecf8e;">7,3 / 10</div><div class="ml">4 équipes</div></div>
<div class="mc"><div class="ml">réponse médiane</div><div class="mv">2 min 40</div><div class="ml">après diffusion</div></div>
<div class="mc"><div class="ml">interventions</div><div class="mv" style="color:#f2b43c;">7</div><div class="ml">dont 3 indices</div></div></div>
<div style="padding:10px 14px 0;display:flex;gap:14px;flex-wrap:wrap;" id="flt"></div>
<div style="padding:8px 14px 0;">
<div style="display:grid;grid-template-columns:118px minmax(0,1fr);"><div></div><div id="axis" style="position:relative;height:16px;font-size:11px;color:#5f7a6b;"></div></div>
<div id="lanes"></div>
<div style="display:grid;grid-template-columns:118px minmax(0,1fr);align-items:center;margin-top:6px;"><span style="font-size:12px;color:#9fb8a9;"><i class="ti ti-player-play"></i> rejouer</span><input type="range" min="0" max="65" value="30" style="width:100%;margin:0;"></div>
<div id="state" style="font-size:12px;color:#9fb8a9;margin:6px 0 0 118px;min-height:18px;"></div>
<div style="font-size:11px;color:#7f9a8a;margin:4px 0 0 118px;display:flex;gap:12px;flex-wrap:wrap;"><span><span style="display:inline-block;width:10px;height:10px;background:#1a4a33;border:0.5px solid #3ecf8e;border-radius:2px;vertical-align:-1px;"></span> ≥ 8</span><span><span style="display:inline-block;width:10px;height:10px;background:#3a2a0a;border:0.5px solid #f2b43c;border-radius:2px;vertical-align:-1px;"></span> 6 – 7</span><span><span style="display:inline-block;width:10px;height:10px;background:#3a1212;border:0.5px solid #ef6b6b;border-radius:2px;vertical-align:-1px;"></span> &lt; 6</span><span>note sur 10 = contenu /8 + temps /2</span></div></div>
<div id="det" style="margin:12px 14px 14px;border:0.5px solid #1d3328;border-radius:8px;padding:12px;"></div></div>
<script>
const MAX=65,P=[5,10,8,10,12,8],SN=['Alerte initiale','Premiers constats','Propagation','Pression médiatique','Arbitrages','Sortie de crise'];
const T=[{n:'Équipe 1',r:'direction',d:[5,11,8,10,13,8],s:[8,7,9,8,6,9],e:[[19,'msg',''],[20,'anim','']]},{n:'Équipe 2',r:'communication',d:[6,13,11,12,14,9],s:[6,5,4,7,6,7],e:[[8,'msg','« Qui contacte l\u2019ARS ? »'],[21,'ind','Fiche réflexe communication p. 2'],[25,'anim','+2 min accordées sur l\u2019étape 3'],[27,'ind','Désigner un porte-parole (auto)'],[52,'anim','']]},{n:'Équipe 3',r:'cellule de crise',d:[5,10,9,10,12,8],s:[9,8,7,9,8,8],e:[[21,'ind',''],[22,'ind','']]},{n:'Équipe 4',r:'opérations',d:[4,8,7,9,11,7],s:[7,6,8,6,7,8],e:[[42,'msg',''],[43,'anim','']]}];
const EI={rep:['ti-check','#3ecf8e','réponses'],ind:['ti-bulb','#f2b43c','indices'],msg:['ti-message','#6fb6f2','messages'],anim:['ti-hand-finger','#ef6b6b','interventions animateur']};
const sel=[1,2],cur=30;
T.forEach(t=>{let c=0;t.st=t.d.map(x=>{const a=c;c+=x;return a;});t.d.forEach((x,i)=>t.e.push([t.st[i]+Math.round(x*0.7),'rep','']));t.tot=t.s.reduce((a,b)=>a+b,0);});
const pc=m=>(m/MAX*100)+'%',col=s=>s>=8?['#1a4a33','#3ecf8e']:s>=6?['#3a2a0a','#f2b43c']:['#3a1212','#ef6b6b'];
document.getElementById('flt').innerHTML=Object.keys(EI).map(k=>`<label class="fl"><input type="checkbox" checked style="accent-color:${EI[k][1]};"><i class="ti ${EI[k][0]}" style="color:${EI[k][1]};"></i>${EI[k][2]}</label>`).join('');
document.getElementById('axis').innerHTML=[0,10,20,30,40,50,60].map(m=>`<span style="position:absolute;left:${pc(m)};transform:translateX(${m?'-50%':'0'});">T+${m}</span>`).join('');
document.getElementById('lanes').innerHTML=T.map((t,ti)=>`<div style="display:grid;grid-template-columns:118px minmax(0,1fr);align-items:center;border-top:0.5px solid #14261d;"><div style="font-size:12px;line-height:1.3;padding:4px 0;">${t.n}<br><span style="color:#7f9a8a;font-size:11px;">${t.r} · ${t.tot}/60</span></div><div style="position:relative;height:40px;">${t.d.map((x,i)=>{const c=col(t.s[i]),f=t.st[i]>=cur;return `<div class="seg ${sel[0]===ti&&sel[1]===i?'sel':''}" style="left:${pc(t.st[i])};width:calc(${pc(x)} - 2px);background:${c[0]};border:0.5px solid ${c[1]};color:${c[1]};opacity:${f?0.25:1};">${x>=6?'é'+(i+1):''}</div>`;}).join('')}${t.e.map(e=>`<i class="ti ${EI[e[1]][0]} mk" style="left:${pc(e[0])};color:${EI[e[1]][1]};opacity:${e[0]>cur?0.2:1};"></i>`).join('')}<div style="position:absolute;top:0;bottom:0;left:${pc(cur)};width:1px;background:#d7e5dc;opacity:0.8;"></div></div></div>`).join('');
const st=T.map(t=>{const i=t.st.findIndex((a,k)=>cur>=a&&cur<a+t.d[k]);return t.n.replace('Équipe ','é')+' : '+(i<0?'terminé':'étape '+(i+1));});
document.getElementById('state').textContent=`à T+${cur} · ${st.join(' · ')}`;
const t=T[1],si=2,r=11,p=8,c=col(4);const ev=t.e.filter(e=>e[1]!=='rep'&&e[0]>=t.st[si]&&e[0]<t.st[si]+r).sort((a,b)=>a[0]-b[0]);
document.getElementById('det').innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;"><div><div style="font-size:11px;color:#7f9a8a;">Équipe 2 · communication</div><div style="font-size:14px;">étape 3 · Propagation</div></div><div style="font-size:22px;font-weight:500;color:${c[1]};">4<span style="font-size:13px;color:#7f9a8a;"> / 10</span></div></div>
<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px;font-size:12px;"><div class="mc"><div class="ml">durée</div>11 min <span style="color:#f2b43c;">(prévu 8)</span></div><div class="mc"><div class="ml">note contenu</div>4 / 8</div><div class="mc"><div class="ml">bonus temps</div>0 / 2</div></div>
<div style="margin-top:10px;font-size:12px;line-height:1.6;"><div style="color:#7f9a8a;">Q1 · choix multiple</div><div>2 / 3 décisions attendues (manque : prévenir ARS et ANSSI)</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;"><div style="border-left:2px solid ${c[1]};padding-left:8px;"><div style="color:#7f9a8a;">Q2 · réponse de l\u2019équipe</div>« Nous ne communiquons pas pour le moment. »</div><div style="border-left:2px solid #3ecf8e;padding-left:8px;"><div style="color:#7f9a8a;">réponse type</div>« Le CHU confirme un incident informatique. Les urgences restent assurées par redirection. Point presse à 16 h. »</div></div></div>
<div style="margin-top:10px;font-size:12px;"><div style="color:#7f9a8a;margin-bottom:2px;">événements de l\u2019étape</div>${ev.map(e=>`<div><span style="color:#5f7a6b;">T+${e[0]}</span> <i class="ti ${EI[e[1]][0]}" style="color:${EI[e[1]][1]};"></i> ${e[2]}</div>`).join('')}</div>
<div style="margin-top:10px;font-size:12px;color:#7f9a8a;">observations de l\u2019animateur</div><div style="margin-top:4px;background:#0b1712;color:#d7e5dc;border:0.5px solid #1d3328;border-radius:6px;font-size:12px;padding:8px;line-height:1.5;">Silence médiatique assumé par l\u2019équipe, contraire à la fiche réflexe. À débriefer avec la communication.</div>`;
</script>
</div></body></html>
